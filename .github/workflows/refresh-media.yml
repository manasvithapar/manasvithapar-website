name: Refresh news and videos
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/manual-media.json'
      - 'scripts/refresh_media.py'
      - 'scripts/render_media.py'
      - 'scripts/validate_media.py'
      - '.github/workflows/refresh-media.yml'
permissions:
  contents: write
concurrency:
  group: refresh-media
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh every 24 hours, or immediately for manual updates
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, pathlib, subprocess
          path = pathlib.Path('data/media.json')
          recent = False
          if path.exists():
              timestamp = json.loads(path.read_text()).get('updated')
              if timestamp:
                  recent = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(timestamp)).total_seconds() < 23 * 3600
          if os.environ['EVENT_NAME'] != 'schedule' or not recent:
              subprocess.run(['python3', 'scripts/refresh_media.py'], check=True)
          PY
      - name: Validate public media records
        run: python3 scripts/validate_media.py
      - name: Render crawlable media archive
        run: python3 scripts/render_media.py
      - name: Publish refreshed coverage
        run: |
          git config user.name 'Website media updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/media.json data/media-candidates.json index.html media/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public news and video coverage'
            git pull --rebase origin main
            git push
          fi
