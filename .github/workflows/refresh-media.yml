name: Refresh news and videos
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/manual-media.json'
      - 'scripts/refresh_media.py'
      - 'scripts/render_media.py'
      - 'scripts/sync_official_youtube.py'
      - 'scripts/validate_media.py'
      - '.github/workflows/refresh-media.yml'
permissions:
  contents: write
concurrency:
  group: refresh-media
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Full YouTube Data API exports are deliberately not run in this commit-to-deploy
      # workflow: API metadata needs a refresh/delete lifecycle that Git history cannot provide.
      # A non-versioned deployment build and the public YouTube privacy/terms notice are required
      # before the catalog sync may be enabled.
      - name: Refresh source-linked coverage
        run: python3 scripts/refresh_media.py
      - name: Validate public media records
        run: python3 scripts/validate_media.py
      - name: Render crawlable media archive
        run: python3 scripts/render_media.py
      - name: Publish refreshed coverage
        run: |
          git config user.name 'Website media updater'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/media.json data/media-candidates.json index.html media sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public news and video coverage'
            git pull --rebase origin main
            git push
          fi
